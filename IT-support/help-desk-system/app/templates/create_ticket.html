<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Ticket - IT Help Desk</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        /* NAVBAR */

        nav {
            background: #111827;
            color: white;
            padding: 18px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            color: #d1d5db;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: white;
        }

        /* MAIN */

        .page {
            max-width: 850px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            margin-bottom: 8px;
            font-size: 30px;
        }

        .header p {
            color: #6b7280;
            margin: 0;
        }

        /* CARD */

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        /* FORM */

        .row {
            display: flex;
            gap: 20px;
        }

        .field {
            flex: 1;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            font-size: 14px;
            background: white;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;

            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        /* BUTTON */

        .button-container {
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 13px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            nav {
                padding: 18px 20px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<nav>

    <div class="logo">
        IT Help Desk
    </div>

    <div>
        <a href="/">Create Ticket</a>
        <a href="/tickets">Dashboard</a>
    </div>

</nav>


<div class="page">

    <div class="header">

        <h1>Create Support Ticket</h1>

        <p>
            Submit a support request and our IT team will investigate the issue.
        </p>

    </div>


    <div class="card">

        <form method="POST">

            <!-- USER INFORMATION -->

            <div class="row">

                <div class="field">

                    <label for="user_name">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="user_name"
                        name="user_name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="field">

                    <label for="user_email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="user_email"
                        name="user_email"
                        placeholder="you@example.com"
                        required
                    >

                </div>

            </div>


            <!-- ISSUE -->

            <div class="field">

                <label for="title">
                    Issue Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Example: Laptop cannot connect to Wi-Fi"
                    required
                >

            </div>


            <div class="field">

                <label for="description">
                    Problem Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe what happened, when it started, and any error messages..."
                    required
                ></textarea>

            </div>


            <!-- CATEGORY + PRIORITY -->

            <div class="row">

                <div class="field">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            Select category
                        </option>

                        <option value="Hardware">
                            Hardware
                        </option>

                        <option value="Software">
                            Software
                        </option>

                        <option value="Network">
                            Network
                        </option>

                        <option value="Account">
                            Account
                        </option>

                        <option value="Security">
                            Security
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label for="priority">
                        Priority
                    </label>

                    <select
                        id="priority"
                        name="priority"
                    >

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium" selected>
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                        <option value="Critical">
                            Critical
                        </option>

                    </select>

                </div>

            </div>


            <!-- SUBMIT -->

            <div class="button-container">

                <button type="submit">
                    Create Support Ticket
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
