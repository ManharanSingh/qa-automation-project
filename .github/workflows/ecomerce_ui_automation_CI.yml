name: Ecomerce UI Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r Ecommerce_UI_Automation_Framework/requirements.txt
    
    - name: Clean old reports
      run: |
          rm -rf Ecommerce_UI_Automation_Framework/reports/report.html
          
    - name: Run tests
      working-directory: Ecommerce_UI_Automation_Framework
      run: |
        python -m pytest tests --html=reports/report.html
        
    - name: Upload test report
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report
        path: Ecommerce_UI_Automation_Framework/reports/report.html
        
    - name: Commit new report
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        git add Ecommerce_UI_Automation_Framework/reports/report.html

        git commit -m "Update automation test report" || echo "No changes to commit"

        git push
