name: Ecommerce UI Automation Tests

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r Ecommerce_UI_Automation_Framework/requirements.txt
        
    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=$GITHUB_WORKSPACE/Ecommerce_UI_Automation_Framework" >> $GITHUB_ENV

    - name: Clean old report
      run: |
        rm -f Ecommerce_UI_Automation_Framework/reports/index.html

    - name: Run tests
      working-directory: Ecommerce_UI_Automation_Framework
      run: |
        pytest tests --html=reports/index.html --self-contained-html

    - name: Upload report artifact
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report
        path: Ecommerce_UI_Automation_Framework/reports/index.html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./Ecommerce_UI_Automation_Framework/reports
